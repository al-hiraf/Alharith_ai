name: FCM + upgrade E2E (signed 3.4.8 -> 3.4.9)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: FCM + upgrade E2E on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 50
        with:
          api-level: 34
          arch: x86_64
          target: google_apis_playstore
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/fcm_e2e.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # v2.3: the script itself pushes ONLY phase.txt beacons + evidence.tar.gpg
      # (GPG ciphertext, key rafiq-ci-evidence) to its unique fcm-run-<id> branch.
      # No plaintext PNGs/logs/ui/dumpsys leave the runner for this production run.
      - name: Upload sealed evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fcm-e2e-sealed
          path: pub/
      - name: Delete public run branch (evidence retained as sealed artifact)
        if: always()
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/fcm-run-${{ github.run_id }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
