name: Dhikr one-shot verification

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        env:
          RAFIQ_SERVER_URL: ${{ vars.RAFIQ_SERVER_URL }}
          RAFIQ_KEYSTORE_B64: ${{ secrets.RAFIQ_KEYSTORE_B64 }}
          RAFIQ_KEY_PASSWORD: ${{ secrets.RAFIQ_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # مفتاح التوقيع السري (إن أُضيف في أسرار المستودع)
          if [ -n "$RAFIQ_KEYSTORE_B64" ] && [ -n "$RAFIQ_KEY_PASSWORD" ]; then
            echo "$RAFIQ_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/rafiq-release.jks"
            export RAFIQ_KEYSTORE="$RUNNER_TEMP/rafiq-release.jks"
            echo "::notice::التوقيع بالمفتاح السري الجديد"
          else
            echo "::notice::نسخة الإصدار بلا توقيع؛ تُوقَّع بالمفتاح الجديد خارج البناء"
          fi
          if ! gradle :app:testFullDebugUnitTest :app:assembleFullDebug --no-daemon 2>&1 | tee build.log; then
            # تلخيص الأخطاء كتنبيهات مقروءة
            grep -E '^e: |error:|ERROR:|What went wrong|FAILED|AssertionError|expected:' -A6 build.log | head -c 60000 > errs.txt || true
            [ -s errs.txt ] || tail -c 20000 build.log > errs.txt
            split -b 3500 errs.txt part_
            for f in part_*; do
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
              echo "::error title=build-$f::$msg"
            done
            exit 1
          fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/dhikr-once.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dhikr-once-evidence
          path: shots/
