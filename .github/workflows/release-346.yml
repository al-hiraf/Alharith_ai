name: Verify & publish Rafiq 3.4.6
on:
  push:
    branches: [release-346]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download candidate from the Rafiq server (unchanged) + public 3.4.4
        run: |
          set -u; mkdir -p new old forged results
          BASE=https://rafiq01.duckdns.org
          curl -fsSL "$BASE/download" -o results/download_page.html || true
          grep -o 'href="[^"]*"' results/download_page.html | sort -u > results/page_links.txt || true
          curl -fsSL "$BASE/static/apk/lineage" -o new/lineage
          for ED in full lite; do
            ok=0
            for n in Rafiq-$ED.apk rafiq-$ED.apk Rafiq-$ED-3.4.6.apk rafiq-3.4.6-$ED.apk Rafiq-3.4.6-$ED.apk $ED.apk; do
              if curl -fsSL "$BASE/static/apk/$n" -o new/Rafiq-$ED.apk; then echo "$ED <- $BASE/static/apk/$n" >> results/sources.txt; ok=1; break; fi
            done
            [ $ok = 1 ] || { grep -o '/static/apk/[^"]*' results/download_page.html >> results/sources.txt; echo "::error::لم أجد ملف $ED على الخادم"; }
          done
          for ED in full lite; do curl -fsSL "https://github.com/al-hiraf/Alharith_ai/releases/download/rafiq-v75/Rafiq-$ED.apk" -o old/Rafiq-$ED.apk; done
          ls -la new old
      - name: Verify signature, version, lineage
        run: |
          set -u
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1); AS="$BT/apksigner"; AA="$BT/aapt2"
          OLD=$(keytool -list -v -keystore app/harith.jks -storepass alharith2026 2>/dev/null | grep -m1 SHA256: | sed 's/.*SHA256: //; s/://g' | tr A-F a-f)
          V=results/verify.txt; : > $V
          echo "old key sha256: $OLD" >> $V
          "$AS" lineage --in new/lineage --print-certs >> $V 2>&1 || echo "FAIL lineage file unreadable" >> $V
          for ED in full lite; do
            f=new/Rafiq-$ED.apk; echo "== $ED $(sha256sum $f)" >> $V
            "$AA" dump badging $f > results/badging_$ED.txt 2>&1 || true
            grep -E "^package:|dkVersion" results/badging_$ED.txt >> $V
            "$AS" verify -v --print-certs $f > results/verify_$ED.txt 2>&1; cat results/verify_$ED.txt >> $V
            "$AS" lineage --in $f --print-certs > results/lineage_in_$ED.txt 2>&1 || true
            grep -q "versionCode='40'" results/badging_$ED.txt && echo "PASS $ED versionCode 40" >> $V || echo "FAIL $ED versionCode" >> $V
            grep -Eq "(minSdkVersion|sdkVersion):'28'" results/badging_$ED.txt && echo "PASS $ED minSdk 28" >> $V || echo "FAIL $ED minSdk" >> $V
            grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" results/verify_$ED.txt && echo "PASS $ED v3" >> $V || echo "FAIL $ED v3" >> $V
            NEWC=$(grep -m1 "Signer: certificate SHA-256 digest" results/verify_$ED.txt | awk '{print $NF}')
            echo "$ED signer: $NEWC" >> $V
            [ -n "$NEWC" ] && [ "$NEWC" != "$OLD" ] && echo "PASS $ED signed with a new key (not the exposed one)" >> $V || echo "FAIL $ED signer is the old key or missing" >> $V
            grep -qi "$OLD" results/lineage_in_$ED.txt && echo "PASS $ED lineage includes old key (upgrade path)" >> $V || echo "FAIL $ED lineage missing old key" >> $V
            # تحديث مزور بنفس الرقم موقّع بالمفتاح القديم فقط
            "$AS" sign --ks app/harith.jks --ks-pass pass:alharith2026 --ks-key-alias harith --key-pass pass:alharith2026 \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --out forged/Rafiq-$ED-oldkey.apk $f
          done
          cat $V
      - uses: actions/upload-artifact@v4
        with: { name: pack, path: "new\nold\nforged\nresults" }
  emu:
    needs: fetch
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 34, arch: x86_64 }
          - { api: 28, arch: x86 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: pack, path: . }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator tests (Android ${{ matrix.api }})
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 40
        with:
          api-level: ${{ matrix.api }}
          arch: ${{ matrix.arch }}
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/release346_emu.sh ${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "emu-${{ matrix.api }}", path: results }
  publish:
    needs: [fetch, emu]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: art }
      - name: Gate — publish only if every check passed
        id: gate
        run: |
          cat art/pack/results/verify.txt art/emu-*/api*/report.txt > all.txt 2>/dev/null || true
          cat all.txt
          P=$(grep -c '^PASS' all.txt || true); F=$(grep -c 'FAIL' all.txt || true)
          echo "pass=$P fail=$F"
          # 10 في التحقق + (ترقية، دردشة، تزوير، رجوع) × نسختين × محاكيين = 16
          if [ "$F" = 0 ] && [ "$P" -ge 26 ]; then echo "ok=1" >> $GITHUB_OUTPUT; else echo "ok=0" >> $GITHUB_OUTPUT; fi
      - name: Publish the exact tested files
        if: steps.gate.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rafiq-3.4.6
          name: رفيق 3.4.6 — مفتاح توقيع جديد (أندرويد ٩ فأحدث)
          make_latest: "true"
          files: |
            art/pack/new/Rafiq-full.apk
            art/pack/new/Rafiq-lite.apk
          body: |
            رفيق 3.4.6 موقّع بمفتاح جديد (توقيع v3 مع سجل انتقال من المفتاح القديم). يتطلب أندرويد ٩ فأحدث.
            ثبّته كتحديث فوق النسخة الحالية — لا تحذف التطبيق القديم.
            Rafiq-full.apk: كاملة. Rafiq-lite.apk: خفيفة (بدون قراءة SMS وإشعارات واتساب).
      - name: Re-download published files and compare fingerprints
        if: steps.gate.outputs.ok == '1'
        run: |
          sleep 20
          for ED in full lite; do
            curl -fsSL "https://github.com/al-hiraf/Alharith_ai/releases/latest/download/Rafiq-$ED.apk" -o pub-$ED.apk
            a=$(sha256sum art/pack/new/Rafiq-$ED.apk | cut -d' ' -f1); b=$(sha256sum pub-$ED.apk | cut -d' ' -f1)
            [ "$a" = "$b" ] && echo "PASS published $ED identical $a" | tee -a all.txt || echo "FAIL published $ED differs ($a vs $b)" | tee -a all.txt
          done
      - name: Results branch
        if: always()
        run: |
          mkdir -p out && cp all.txt out/ 2>/dev/null; cp -r art/pack/results out/fetch 2>/dev/null; for d in art/emu-*; do cp -r "$d" out/ 2>/dev/null; done
          echo "gate=${{ steps.gate.outputs.ok }}" > out/GATE.txt
          cd out && git init -q && git checkout -q -b release-346-results && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "release 3.4.6 checks" && \
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" release-346-results
