name: Signed APK install check
on:
  workflow_dispatch:
    inputs:
      draft_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download reviewed signed files from private draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_ID: ${{ inputs.draft_id }}
        run: |
          mkdir -p signed shots
          gh api repos/${{ github.repository }}/releases/$DRAFT_ID/assets > /tmp/assets.json
          python3 - <<'PY'
          import json,subprocess
          for a in json.load(open('/tmp/assets.json')):
              if a['name'] in ['Rafiq-full.apk','Rafiq-lite.apk']:
                  with open('signed/'+a['name'],'wb') as f:
                      subprocess.run(['gh','api',a['url'],'-H','Accept: application/octet-stream'],stdout=f,check=True)
          PY
          sha256sum signed/*.apk > shots/signed-hashes.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/scripts/signed-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signed-install-evidence
          path: shots/
