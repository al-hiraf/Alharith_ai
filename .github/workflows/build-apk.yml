name: Build Rafiq APK

on:
  push:
    paths-ignore: ['**.md', 'server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        env:
          RAFIQ_SERVER_URL: ${{ vars.RAFIQ_SERVER_URL }}
        run: |
          set -o pipefail
          if ! gradle :app:testFullDebugUnitTest :app:assembleFullRelease :app:assembleLiteRelease :app:assembleFullDebug --no-daemon 2>&1 | tee build.log; then
            # تلخيص الأخطاء كتنبيهات مقروءة
            grep -E '^e: |error:|ERROR:|What went wrong|FAILED|AssertionError|expected:' -A6 build.log | head -c 60000 > errs.txt || true
            [ -s errs.txt ] || tail -c 20000 build.log > errs.txt
            split -b 3500 errs.txt part_
            for f in part_*; do
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
              echo "::error title=build-$f::$msg"
            done
            exit 1
          fi

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk Rafiq-full.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk Rafiq-lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Rafiq-apk
          path: Rafiq-*.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rafiq-v${{ github.run_number }}
          name: رفيق — بناء ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: |
            Rafiq-lite.apk
            Rafiq-full.apk
          body: |
            Rafiq-lite.apk: تُثبَّت مباشرة (بدون قراءة SMS وإشعارات واتساب).
            Rafiq-full.apk: كاملة، وقد يحظرها Play Protect عند التثبيت من خارج المتجر.

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android 14 emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh

      - name: Publish test results (screenshots branch)
        if: always()
        run: |
          mkdir -p shots && cp app/build/reports/tests/testFullDebugUnitTest/index.html shots/unit-tests.html 2>/dev/null || true
          ls app/build/test-results/testFullDebugUnitTest/*.xml >/dev/null 2>&1 && cp app/build/test-results/testFullDebugUnitTest/*.xml shots/ || true
          cd shots && git init -q && git checkout -q -b screenshots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run ${{ github.run_number }}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
