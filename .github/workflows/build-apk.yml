name: Build AlHarith AI APK

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AlHarithAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlHarithAI-apk
          path: AlHarithAI.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alharith-ai-v${{ github.run_number }}
          name: الحارث AI — بناء ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AlHarithAI.apk
          body: |
            ثبّت الملف AlHarithAI.apk على هاتف Android (اسمح بالتثبيت من مصادر غير معروفة).
