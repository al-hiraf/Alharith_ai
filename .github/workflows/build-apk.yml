name: Build AlHarith AI APK

on:
  push:
    paths-ignore: ['**.md']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          if ! gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log; then
            # تلخيص الأخطاء كتنبيهات مقروءة
            grep -E '^e: |error:|ERROR:|What went wrong' -A6 build.log | head -c 60000 > errs.txt || true
            [ -s errs.txt ] || tail -c 20000 build.log > errs.txt
            split -b 3500 errs.txt part_
            for f in part_*; do
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
              echo "::error title=build-$f::$msg"
            done
            exit 1
          fi

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk AlHarithAI.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlHarithAI-apk
          path: AlHarithAI.apk

      - name: Publish download link (GitHub Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: alharith-ai-v${{ github.run_number }}
          name: الحارث AI — بناء ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AlHarithAI.apk
          body: |
            ثبّت الملف AlHarithAI.apk على هاتف Android (اسمح بالتثبيت من مصادر غير معروفة).
