name: Build Rafiq APK

on:
  push:
    paths-ignore: ['**.md', 'server/**', '.github/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (preinstalled on runner)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        shell: bash
        env:
          RAFIQ_SERVER_URL: ${{ vars.RAFIQ_SERVER_URL }}
          RAFIQ_KEYSTORE_B64: ${{ secrets.RAFIQ_KEYSTORE_B64 }}
          RAFIQ_KEY_PASSWORD: ${{ secrets.RAFIQ_KEY_PASSWORD }}
        run: |
          set -o pipefail
          # مفتاح التوقيع السري (إن أُضيف في أسرار المستودع)
          if [ -n "$RAFIQ_KEYSTORE_B64" ] && [ -n "$RAFIQ_KEY_PASSWORD" ]; then
            echo "$RAFIQ_KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/rafiq-release.jks"
            export RAFIQ_KEYSTORE="$RUNNER_TEMP/rafiq-release.jks"
            echo "::notice::التوقيع بالمفتاح السري الجديد"
          else
            echo "::notice::نسخة الإصدار بلا توقيع؛ تُوقَّع بالمفتاح الجديد خارج البناء"
          fi
          if ! gradle :app:testFullDebugUnitTest :app:assembleFullRelease :app:assembleLiteRelease :app:assembleFullDebug --no-daemon 2>&1 | tee build.log; then
            # تلخيص الأخطاء كتنبيهات مقروءة
            grep -E '^e: |error:|ERROR:|What went wrong|FAILED|AssertionError|expected:' -A6 build.log | head -c 60000 > errs.txt || true
            [ -s errs.txt ] || tail -c 20000 build.log > errs.txt
            split -b 3500 errs.txt part_
            for f in part_*; do
              msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' "$f")
              echo "::error title=build-$f::$msg"
            done
            exit 1
          fi

      - name: Unsigned release APKs + official signing tool (ci-builds branch, not published)
        run: |
          # لا نشر تلقائي: الإصدار يُوقَّع بالمفتاح الجديد خارج البناء ثم يُختبر ثم يُنشر يدويًا
          mkdir -p out && cd out
          for f in full lite; do
            src=$(ls ../app/build/outputs/apk/$f/release/*.apk | head -1)
            cp "$src" "Rafiq-$f-unsigned.apk"
          done
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          cp "$BT/lib/apksigner.jar" apksigner.jar
          cp "$BT/zipalign" zipalign 2>/dev/null || true
          { echo "commit ${{ github.sha }}"; echo "run ${{ github.run_number }}"; echo "build-tools $(basename $BT)"; sha256sum *.apk apksigner.jar; } > BUILD_INFO.txt
          cat BUILD_INFO.txt
          git init -q && git checkout -q -b ci-builds && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "unsigned build ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-builds

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android 14 emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 45
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke.sh

      - name: Publish test results (screenshots branch)
        if: always()
        run: |
          mkdir -p shots && cp app/build/reports/tests/testFullDebugUnitTest/index.html shots/unit-tests.html 2>/dev/null || true
          ls app/build/test-results/testFullDebugUnitTest/*.xml >/dev/null 2>&1 && cp app/build/test-results/testFullDebugUnitTest/*.xml shots/ || true
          cd shots && git init -q && git checkout -q -b screenshots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "run ${{ github.run_number }}" || exit 0
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" screenshots
