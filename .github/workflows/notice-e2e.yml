name: Notice E2E (signed 3.4.8)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Notice E2E on Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 60
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/notice_e2e.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # v2.3: production fixture => NO plaintext evidence public. Seal everything
      # with the pinned rafiq-ci-evidence key; publish ciphertext only; fail-closed.
      - name: Seal evidence (GPG, pinned key, fail-closed)
        if: always()
        run: |
          gpg --batch --import .github/ci-evidence-pub.asc
          FPR=$(gpg --batch --with-colons -k rafiq-ci-evidence | awk -F: '/^fpr/{print $10; exit}')
          if [ "$FPR" != "5938A7146717E9B11423EE94D64EA219EEAAB2D3" ]; then echo "KEY-PIN-MISMATCH not-publishing"; exit 0; fi
          mkdir -p pub && tar czf /tmp/notice-evidence.tar.gz shots
          gpg --batch --yes --trust-model always -r "$FPR" -o pub/evidence.tar.gpg -e /tmp/notice-evidence.tar.gz || { rm -f pub/evidence.tar.gpg; exit 0; }
          gpg --batch --list-packets pub/evidence.tar.gpg | grep -q "pubkey enc packet" || { rm -f pub/evidence.tar.gpg; exit 0; }
      - name: Upload sealed evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notice-e2e-sealed
          path: pub/
      - name: Push sealed evidence to unique run branch
        if: always()
        run: |
          cd pub && git init -q && git checkout -q -b "notice-run-${{ github.run_id }}" && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "notice-e2e sealed evidence ${{ github.run_id }}" || exit 0
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" "notice-run-${{ github.run_id }}"
      - name: Delete public run branch (evidence retained as sealed artifact)
        if: always()
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/notice-run-${{ github.run_id }}" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
